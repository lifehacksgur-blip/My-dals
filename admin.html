<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deal Dhamaka - Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-4">
<h1 class="text-2xl font-bold mb-4">🔥 Deal Dhamaka Admin - Vercel Connected ✅</h1>

<!-- YE LINE SABSE IMPORTANT HAI - TERA NAYA VERCEL URL -->
<script>
const API_URL = "https://my-dals.vercel.app/api/productPreview";
</script>

<div class="bg-zinc-900 p-4 rounded-xl mb-4">
<textarea id="links" class="w-full h-32 bg-black p-3 rounded text-white" placeholder="Ek line me ek link daal - jaise:
https://www.fkrt.co/GK3hbS
https://www.amazon.in/dp/..."></textarea>
<button onclick="bulkFetch()" id="btn" class="mt-3 bg-white text-black px-6 py-3 rounded-full font-bold">🚀 Bulk Fetch</button>
<div id="status" class="mt-2 text-sm text-zinc-400"></div>
</div>

<div id="products" class="grid gap-3"></div>

<script>
async function bulkFetch(){
  const btn=document.getElementById('btn');
  const txt=document.getElementById('links').value.trim().split('\n').filter(Boolean);
  if(!txt.length) return alert('Link daal bhai!');
  btn.innerText='Fetching...'; btn.disabled=true;
  document.getElementById('products').innerHTML='';

  for(let i=0;i<txt.length;i++){
    const url=txt[i].trim();
    document.getElementById('status').innerText=`Fetching ${i+1}/${txt.length}: ${url}`;
    try{
      const res=await fetch(`${API_URL}?url=${encodeURIComponent(url)}`);
      const data=await res.json();
      if(data.success){
        const div=document.createElement('div');
        div.className='bg-zinc-900 p-4 rounded-xl flex gap-3';
        div.innerHTML=`<img src="${data.image}" class="w-20 h-20 object-cover rounded"><div><h3 class="font-bold">${data.title}</h3><p>₹${data.price} <span class="line-through text-zinc-500">₹${data.originalPrice}</span></p><p class="text-xs text-zinc-400">${data.finalUrl}</p><button onclick='saveProduct(${JSON.stringify(data).replace(/'/g,"&#39;")})' class="mt-2 bg-green-500 text-black px-3 py-1 rounded text-sm">Save to Firebase</button></div>`;
        document.getElementById('products').appendChild(div);
      } else {
        throw new Error(data.error);
      }
    }catch(e){
      const div=document.createElement('div');
      div.className='bg-red-900/50 p-3 rounded';
      div.innerText=`FAILED: ${url} - ${e.message}`;
      document.getElementById('products').appendChild(div);
    }
  }
  btn.innerText='🚀 Bulk Fetch'; btn.disabled=false;
  document.getElementById('status').innerText=`Done! ${txt.length} links processed.`;
}

async function saveProduct(data){
  alert('Product ready to save: '+data.title+' - Ab Firebase me add karna hai toh bolo main pura save wala code bhi de dunga!');
  console.log(data);
}
</script>
</body>
  </html>
